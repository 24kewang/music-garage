version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so CI has something meaningful to gate on
      # rather than a queue of single-line bumps.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # three and @types/three are pinned to matching versions on purpose, and
      # mind-ar is built against this three. Bump them together, by hand.
      - dependency-name: three
      - dependency-name: "@types/three"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
